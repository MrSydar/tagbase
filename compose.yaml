services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: tagbase
      POSTGRES_PASSWORD: tagbase
      POSTGRES_DB: tagbase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tagbase -d tagbase"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  tagger:
    build:
      context: .
      dockerfile: tagger/Dockerfile
    environment:
      TAGGER_HTTP_ADDR: ":8081"
      TAGGER_STORAGE_BASE_URL: "http://storage:8080"
      TAGGER_EVALUATOR_IMPL: "grep"
    ports:
      - "8081:8081"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  storage:
    build:
      context: .
      dockerfile: storage/Dockerfile
    environment:
      TAGBASE_HTTP_ADDR: ":8080"
      TAGBASE_PG_DSN: "postgres://tagbase:tagbase@postgres:5432/tagbase?sslmode=disable"
      TAGBASE_S3_ENDPOINT: "http://minio:9000"
      TAGBASE_S3_REGION: "us-east-1"
      TAGBASE_S3_BUCKET: "tagbase"
      TAGBASE_S3_ACCESS_KEY: "minioadmin"
      TAGBASE_S3_SECRET_KEY: "minioadmin"
      TAGBASE_S3_FORCE_PATH_STYLE: "true"
      TAGBASE_TAG_ENGINE_URL: "http://tagger:8081"
      TAGBASE_DEFAULT_LIMIT: "5"
      TAGBASE_MAX_LIMIT: "100"
      TAGBASE_DEFAULT_TTL: "0"
      TAGBASE_MAX_TAGS_PER_QUERY: "100"
      TAGBASE_MAX_OBJECT_SIZE_BYTES: "10485760"
      TAGBASE_RETENTION_SWEEP_INTERVAL: "60s"
    ports:
      - "8080:8080"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      tagger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
